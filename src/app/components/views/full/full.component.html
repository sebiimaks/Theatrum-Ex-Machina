<div
  class="meta-container workbench-card"
  [class.workbench-card-selected]="video().selected"
  [ngStyle]="{
    height: measuredContentHeight + 'px',
    width: computedWidth + 'px'
  }"
  >
  <!-- the 30 px added above is the padding for the text  -->

@if (showFavorites()) {
  <button
    type="button"
    (click)="toggleHeart($event)"
    (dblclick)="$event.stopPropagation()"
    class="heart workbench-gallery-action"
    [ngClass]="{ 'heart-lit' : video().stars === 5.5 }"
    [attr.aria-pressed]="video().stars === 5.5"
    [attr.aria-label]="((video().stars === 5.5 ? 'BUTTONS.removeFromFavorites' : 'BUTTONS.addToFavorites') | translate) + ': ' + (video().cleanName || video().fileName)"
    title="{{ (video().stars === 5.5 ? 'BUTTONS.removeFromFavorites' : 'BUTTONS.addToFavorites') | translate }}"
  >
    <app-icon [icon]="'icon-heart'" [size]="16" />
  </button>
}

@if (isImportFailure()) {
  <div
    (click)="videoClick.emit({ mouseEvent: $event })"
    (dblclick)="videoClick.emit({ mouseEvent: $event, doubleClick: true })"
    (contextmenu)="rightClick.emit({ mouseEvent: $event, item: video() })"
    class="filmstrip-container import-error-placeholder"
    [ngStyle]="{ height: _imgHeight + 'px' }"
    title="import_error"
  >
    <app-icon [icon]="'icon-video-x'" [size]="32" />
    <span>import_error</span>
  </div>
}

@for (row of rowOffsets; track row) {
  <div
    (click)="   videoClick.emit({ mouseEvent: $event })"
    (dblclick)="videoClick.emit({ mouseEvent: $event, doubleClick: true })"
    (contextmenu)="rightClick.emit({ mouseEvent: $event, item: video() })"
    class="filmstrip-container"
    [ngStyle]="{
        height: _imgHeight + 'px',
        'background-image': 'url(' + fullFilePath() + ')',
        'background-position-x': '-' + (row * _imgHeight * 16 / 9) + 'px',
        'background-size': 'auto ' + _imgHeight + 'px'
      }"
  ></div>
}

@if (video().selected) {
  <app-icon class="selected" [icon]="'icon-show-more-info'" />
}

@if (showMeta()) {
  <span
    [ngClass]="{ 'larger-font': largerFont() }"
    class="title"
    [attr.title]="video().cleanName === '*FOLDER*' ? video().fileName : video().cleanName"
  >
    {{ video().cleanName }}
  </span>
}

</div>
