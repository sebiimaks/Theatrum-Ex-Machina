@for (tag of _tags; track tag.colourPath || tag.name) {

<div class="singleTag">

  <button
    type="button"
    class="search-or-tag-general tag"
    [ngClass]="{ 'tag-draggable': draggable() }"
    [ngStyle]="{
      background: tag.colour,
      color: tag.colour ? getContrastColor(tag.colour) : 'black'
    }"
    (click)="tagClick(tag, $event)"
    (contextmenu)="onTagRightClick($event, tag)"
    [draggable]='draggable()'
    (dragstart)="tagDragStart($event, tag)"
    [attr.aria-label]="getTagAriaLabel(tag)"
    [attr.title]="getTagTitle(tag)"
  >
    <span>{{ tag.displayName || tag.name }}</span>
    @if (tag.autoFileMatch || tag.autoFolderMatch) {
      <span class="tag-auto-match-markers" aria-hidden="true">
        @if (tag.autoFileMatch) {
          <span class="tag-auto-match-dot tag-auto-file-match"></span>
        }
        @if (tag.autoFolderMatch) {
          <span class="tag-auto-match-dot tag-auto-folder-match"></span>
        }
      </span>
    }
  </button>

@if (displayFrequency()) {
  <span class="frequency" [ngClass]="{ 'frequency-dark': darkMode() }">
    {{ tagService.tagsFrequencyMap.get(tag.name) }}
  </span>
}

@if (tag.removable) {
  <button
    type="button"
    [ngClass]="{ 'remove-tag-dark': darkMode() }"
    class="remove-tag"
    (click)="removeTag(tag.colourPath || tag.name)"
    [attr.aria-label]="'WORKBENCH.removeVideoTag' | translate: { tagName: tag.colourPath || tag.name }"
    [attr.title]="'WORKBENCH.removeVideoTag' | translate: { tagName: tag.colourPath || tag.name }"
  >
    <app-icon [icon]="'icon-close'" [size]="11" />
  </button>
}

</div>

} <!-- end of @for -->

@if (draggable()) {

<div style="transform: translate(-100px, -100px)">
  <span #dragHack class="search-or-tag-general tag special">
    hack tag
  </span>
</div>

}
