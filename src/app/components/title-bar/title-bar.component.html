<div
  class="title-bar"
  [ngClass]="{
    'dark-mode-override': settingsButtons().darkMode.toggled,
    'title-bar-mac': macVersion(),
    'title-bar-windows': !macVersion()
  }"
>
  <div
    class="draggable"
  >
    <img
      width="16px"
      height="16px"
      class="top-logo"
      [src]="settingsButtons().darkMode.toggled ? './assets/logo-dark.png' : './assets/logo-light.png'"
      alt=""
    >
    <span
      class="heading-title"
    >
      Theatrum Ex Machina
      {{ importStage() !== 'done' ? ' - ' + progressString() + ' - ' : ' - ' }}
      {{ appState().hubName }}
    </span>
  </div>
  <div
    (click)="initiateMinimize.emit()"
    [ngClass]="{
        'windows-button': !macVersion(),
        'mac-button': macVersion()
      }"
    class="minimizeButton"
  >
    <app-icon class="window-button" [icon]="'icon-minus'" />
  </div>
  <div
    (click)="initiateMaximize.emit()"
    [ngClass]="{
        'windows-button': !macVersion(),
        'mac-button': macVersion()
      }"
    class="maximizeButton"
  >
    <app-icon class="window-button" [icon]="'icon-maximize'" />
  </div>
  <div
    (click)="initiateClose.emit()"
    [ngClass]="{
        'windows-button': !macVersion(),
        'mac-button': macVersion()
      }"
    class="closeButton"
  >
    <app-icon class="window-button" [icon]="'icon-close'" />
  </div>
</div>
